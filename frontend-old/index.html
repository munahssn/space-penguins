<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPHEREx Blink</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>SPHEREx Blink</h1>
    <span id="status" class="muted"></span>
  </header>

  <main>
    <form id="search">
      <label>Test target
        <select id="target"><option value="">Choose…</option></select>
      </label>
      <div class="row">
        <label>RA (deg) <input id="ra" type="number" step="any" required></label>
        <label>Dec (deg) <input id="dec" type="number" step="any" required></label>
      </div>
      <div class="row">
        <label>Field of view
          <select id="fov">
            <option value="0.05">3′</option>
            <option value="0.1" selected>6′</option>
            <option value="0.2">12′</option>
            <option value="0.4">24′</option>
          </select>
        </label>
        <label>Detector
          <select id="det">
            <option>D1</option><option>D2</option><option selected>D3</option>
            <option>D4</option><option>D5</option><option>D6</option>
            <option value="all">All</option>
          </select>
        </label>
      </div>
      <button type="submit">Load</button>
    </form>

    <section id="viewer">
      <div class="stage">
        <img id="frame" alt="SPHEREx frame">
        <div class="crosshair"></div>
      </div>
      <div class="controls">
        <button id="play" type="button" disabled>Play</button>
        <input id="slider" type="range" min="0" max="0" value="0" disabled>
        <label class="speed">Speed <input id="speed" type="range" min="100" max="1500" value="600"></label>
        <button id="diff" type="button" disabled>Difference</button>
      </div>
      <p id="frameinfo" class="muted"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
